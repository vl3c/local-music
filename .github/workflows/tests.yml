name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs on PR updates only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole suite runs without a GPU or model weights: the engine worker and the scorers
  # are faked (tests/test_server.py), so this checks the analysis, mastering, loops, checks,
  # every endpoint, the CLI and the downloader. The job name is the required status check.
  # Windows, the platform the tool targets.
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (no torch, no models)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: pytest
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Pre-publish safety scan (files and history)
        run: |
          git fetch --unshallow --quiet || true
          python scripts/check_repo_safe.py --history
